[package]
name = "ical-vikunja-sync"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "AGPL-3.0"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
clap = { version = "4", features = ["derive", "env"] }
env_toml = "0.2"
icalendar = { version = "0.17", features = ["parser", "recurrence", "chrono-tz"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
toml = "1.1"
url = "2"
